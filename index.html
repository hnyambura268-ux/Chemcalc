<script>
const panel=document.getElementById('panel');
const elements=[["H", "Hydrogen", 1], ["He", "Helium", 2], ["Li", "Lithium", 3], ["Be", "Beryllium", 4], ["B", "Boron", 5], ["C", "Carbon", 6], ["N", "Nitrogen", 7], ["O", "Oxygen", 8], ["F", "Fluorine", 9], ["Ne", "Neon", 10], ["Na", "Sodium", 11], ["Mg", "Magnesium", 12], ["Al", "Aluminium", 13], ["Si", "Silicon", 14], ["P", "Phosphorus", 15], ["S", "Sulfur", 16], ["Cl", "Chlorine", 17], ["Ar", "Argon", 18], ["K", "Potassium", 19], ["Ca", "Calcium", 20], ["Sc", "Scandium", 21], ["Ti", "Titanium", 22], ["V", "Vanadium", 23], ["Cr", "Chromium", 24], ["Mn", "Manganese", 25], ["Fe", "Iron", 26], ["Co", "Cobalt", 27], ["Ni", "Nickel", 28], ["Cu", "Copper", 29], ["Zn", "Zinc", 30], ["Ga", "Gallium", 31], ["Ge", "Germanium", 32], ["As", "Arsenic", 33], ["Se", "Selenium", 34], ["Br", "Bromine", 35], ["Kr", "Krypton", 36], ["Rb", "Rubidium", 37], ["Sr", "Strontium", 38], ["Y", "Yttrium", 39], ["Zr", "Zirconium", 40], ["Nb", "Niobium", 41], ["Mo", "Molybdenum", 42], ["Tc", "Technetium", 43], ["Ru", "Ruthenium", 44], ["Rh", "Rhodium", 45], ["Pd", "Palladium", 46], ["Ag", "Silver", 47], ["Cd", "Cadmium", 48], ["In", "Indium", 49], ["Sn", "Tin", 50], ["Sb", "Antimony", 51], ["Te", "Tellurium", 52], ["I", "Iodine", 53], ["Xe", "Xenon", 54], ["Cs", "Caesium", 55], ["Ba", "Barium", 56], ["La", "Lanthanum", 57], ["Ce", "Cerium", 58], ["Pr", "Praseodymium", 59], ["Nd", "Neodymium", 60], ["Pm", "Promethium", 61], ["Sm", "Samarium", 62], ["Eu", "Europium", 63], ["Gd", "Gadolinium", 64], ["Tb", "Terbium", 65], ["Dy", "Dysprosium", 66], ["Ho", "Holmium", 67], ["Er", "Erbium", 68], ["Tm", "Thulium", 69], ["Yb", "Ytterbium", 70], ["Lu", "Lutetium", 71], ["Hf", "Hafnium", 72], ["Ta", "Tantalum", 73], ["W", "Tungsten", 74], ["Re", "Rhenium", 75], ["Os", "Osmium", 76], ["Ir", "Iridium", 77], ["Pt", "Platinum", 78], ["Au", "Gold", 79], ["Hg", "Mercury", 80], ["Tl", "Thallium", 81], ["Pb", "Lead", 82], ["Bi", "Bismuth", 83], ["Po", "Polonium", 84], ["At", "Astatine", 85], ["Rn", "Radon", 86], ["Fr", "Francium", 87], ["Ra", "Radium", 88], ["Ac", "Actinium", 89], ["Th", "Thorium", 90], ["Pa", "Protactinium", 91], ["U", "Uranium", 92], ["Np", "Neptunium", 93], ["Pu", "Plutonium", 94], ["Am", "Americium", 95], ["Cm", "Curium", 96], ["Bk", "Berkelium", 97], ["Cf", "Californium", 98], ["Es", "Einsteinium", 99], ["Fm", "Fermium", 100], ["Md", "Mendelevium", 101], ["No", "Nobelium", 102], ["Lr", "Lawrencium", 103], ["Rf", "Rutherfordium", 104], ["Db", "Dubnium", 105], ["Sg", "Seaborgium", 106], ["Bh", "Bohrium", 107], ["Hs", "Hassium", 108], ["Mt", "Meitnerium", 109], ["Ds", "Darmstadtium", 110], ["Rg", "Roentgenium", 111], ["Cn", "Copernicium", 112], ["Nh", "Nihonium", 113], ["Fl", "Flerovium", 114], ["Mc", "Moscovium", 115], ["Lv", "Livermorium", 116], ["Ts", "Tennessine", 117], ["Og", "Oganesson", 118]];
function home(){location.reload()}
function page(t,b){panel.innerHTML='<button class="back" data-home>← Home</button><h2>'+t+'</h2>'+b}
function gas(){page('Gas Laws',`<div class="law"><h3>Boyle's Law</h3><div class="formula">P₁V₁ = P₂V₂</div><button data-g="boyle">Open</button></div><div class="law"><h3>Charles's Law</h3><div class="formula">V₁/T₁ = V₂/T₂</div><button data-g="charles">Open</button></div><div class="law"><h3>Gay-Lussac's Law</h3><div class="formula">P₁/T₁ = P₂/T₂</div><button data-g="gay">Open</button></div><div class="law"><h3>Combined Gas Law</h3><div class="formula">P₁V₁/T₁ = P₂V₂/T₂</div><button data-g="combined">Open</button></div><div class="law"><h3>Ideal Gas Law</h3><div class="formula">PV = nRT</div><button data-g="ideal">Open</button></div><div class="law"><h3>Avogadro's Law</h3><div class="formula">V₁/n₁ = V₂/n₂</div><button data-g="avogadro">Open</button></div><div class="law"><h3>Dalton's Law</h3><div class="formula">Ptotal = ΣP</div><button data-g="dalton">Open</button></div><div class="law"><h3>Gas Density</h3><div class="formula">d = PM/RT</div><button data-g="density">Open</button></div><p class="muted">Use kelvin: K = °C + 273.15.</p>`)}
function form(type){let title=type,b='';let f=(a)=>a.map(x=>'<label>'+x[1]+'</label><input id="'+x[0]+'" type="number" step="any">').join('')+'<button class="primary" data-gcalc="'+type+'">Calculate</button><div id="r"></div>';if(type==='boyle')b=f([['p1','P₁'],['v1','V₁'],['p2','P₂']]);if(type==='charles')b=f([['v1','V₁'],['t1','T₁ (K)'],['t2','T₂ (K)']]);if(type==='gay')b=f([['p1','P₁'],['t1','T₁ (K)'],['t2','T₂ (K)']]);if(type==='combined')b=f([['p1','P₁'],['v1','V₁'],['t1','T₁ (K)'],['p2','P₂'],['v2','V₂']]);if(type==='ideal')b=f([['p','P'],['v','V (L)'],['n','n (mol)'],['t','T (K)']]);if(type==='avogadro')b=f([['v1','V₁'],['n1','n₁'],['n2','n₂']]);if(type==='dalton')b='<label>Partial pressures, comma separated</label><input id="parts" placeholder="0.2,0.3,0.5"><button class="primary" data-gcalc="dalton">Calculate</button><div id="r"></div>';if(type==='density')b=f([['p','P (atm)'],['m','M (g/mol)'],['t','T (K)']]);page(title,b)}
function n(id){return Number(document.getElementById(id).value)}
function gascalc(t){let r,msg;try{if(t==='boyle'){let p1=n('p1'),v1=n('v1'),p2=n('p2');r=p1*v1/p2;msg=`V₂ = ${r.toFixed(4)}\nWorking: V₂ = P₁V₁/P₂`}else if(t==='charles'){let v1=n('v1'),t1=n('t1'),t2=n('t2');r=v1*t2/t1;msg=`V₂ = ${r.toFixed(4)}\nWorking: V₂ = V₁T₂/T₁`}else if(t==='gay'){let p1=n('p1'),t1=n('t1'),t2=n('t2');r=p1*t2/t1;msg=`P₂ = ${r.toFixed(4)}\nWorking: P₂ = P₁T₂/T₁`}else if(t==='combined'){let p1=n('p1'),v1=n('v1'),t1=n('t1'),p2=n('p2'),v2=n('v2');r=p2*v2*t1/(p1*v1);msg=`T₂ = ${r.toFixed(4)} K\nWorking: T₂ = P₂V₂T₁/(P₁V₁)`}else if(t==='ideal'){let p=n('p'),v=n('v'),nn=n('n'),tt=n('t');r=p*v/(nn*.082057*tt);msg=`n = ${r.toFixed(4)} mol\nWorking: n = PV/RT`}else if(t==='avogadro'){let v1=n('v1'),n1=n('n1'),n2=n('n2');r=v1*n2/n1;msg=`V₂ = ${r.toFixed(4)}\nWorking: V₂ = V₁n₂/n₁`}else if(t==='dalton'){let a=document.getElementById('parts').value.split(',').map(Number);r=a.reduce((a,b)=>a+b,0);msg=`Ptotal = ${r.toFixed(4)}\nWorking: add the partial pressures.`}else{let p=n('p'),m=n('m'),tt=n('t');r=p*m/(.082057*tt);msg=`d = ${r.toFixed(4)} g/L\nWorking: d = PM/RT`}if(!Number.isFinite(r))throw 0;document.getElementById('r').textContent=msg}catch(e){document.getElementById('r').textContent='Please enter valid values.'}}
function periodic(){let cells='';let positions={1:[1,1],2:[18,1],3:[1,2],4:[2,2],5:[13,2],6:[14,2],7:[15,2],8:[16,2],9:[17,2],10:[18,2]};elements.forEach((e,i)=>{let z=e[2],row=Math.floor((z-1)/18)+1,col=((z-1)%18)+1;if(z<=20){let p=positions[z]||[col,row];row=p[1];col=p[0]}cells+=`<button class="el" data-el="${e[2]}" style="grid-column:${col};grid-row:${row}"><b>${e[0]}</b><small>${e[2]}</small></button>`});page('Periodic Table',`<p class="muted">All 118 elements. Tap an element for details.</p><div class="ptable">${cells}</div><div id="elementInfo" class="result">Select an element.</div>`)}
function balance(){page('Chemical Equation Balancer',`<label>Enter an equation</label><input id="eq" value="H2 + O2 -> H2O"><button class="primary" data-balance>Balance Equation</button><div id="r"></div><p class="muted">Try: Fe + O2 -> Fe2O3</p>`)}
function parseFormula(s){let out={};let re=/([A-Z][a-z]?)(\d*)/g,m;while((m=re.exec(s))){let el=m[1],c=Number(m[2]||1);out[el]=(out[el]||0)+c}return out}
function gcd(a,b){while(b){let t=a%b;a=b;b=t}return Math.abs(a)}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}
function balanceEq(eq){
  eq=eq.replace(/→|=/g,'->');
  const parts=eq.split('->'); if(parts.length!==2)return null;
  const L=parts[0].split('+').map(x=>x.trim()).filter(Boolean), R=parts[1].split('+').map(x=>x.trim()).filter(Boolean);
  const species=L.concat(R); if(!L.length||!R.length||species.length>4)return null;
  const parsed=species.map(parseFormula);
  const els=[...new Set(parsed.flatMap(o=>Object.keys(o)))];
  const max=30;
  function ok(c){for(const el of els){let a=0,b=0;L.forEach((_,i)=>a+=(parsed[i][el]||0)*c[i]);R.forEach((_,j)=>b+=(parsed[L.length+j][el]||0)*c[L.length+j]);if(a!==b)return false;}return true;}
  function gcdList(a){return a.reduce((g,v)=>gcd(g,Math.abs(v)),0)||1}
  function norm(c){let g=gcdList(c);c=c.map(v=>v/g);if(c.some(v=>v<0))c=c.map(v=>-v);return c;}
  for(let c1=1;c1<=max;c1++)for(let c2=1;c2<=max;c2++)for(let c3=1;c3<=max;c3++)for(let c4=1;c4<=max;c4++){
    const c=species.length===2?[c1,c2]:species.length===3?[c1,c2,c3]:[c1,c2,c3,c4];
    if(ok(c)){const n=norm(c);if(n.every(v=>v>0))return n;}
  }
  return null;
}
function doBalance(){let eq=document.getElementById('eq').value.trim();let ans=balanceEq(eq);if(!ans){document.getElementById('r').textContent='I can balance common equations such as H2 + O2 -> H2O and Fe + O2 -> Fe2O3.';return}let p=eq.replace(/→|=/g,'->').split('->');let L=p[0].split('+').map(x=>x.trim()),R=p[1].split('+').map(x=>x.trim()),all=L.concat(R);let left=ans.slice(0,L.length).map((c,i)=>`${c===1?'':c}${L[i]}`).join(' + '),right=ans.slice(L.length).map((c,i)=>`${c===1?'':c}${R[i]}`).join(' + ');document.getElementById('r').textContent=`Balanced: ${left} → ${right}`}
/* Quiz */
let q=[['Which law relates pressure and volume at constant temperature?',['Boyle’s Law','Charles’s Law','Avogadro’s Law','Dalton’s Law'],0],['What must temperature be converted to for gas-law calculations?',['Kelvin','Fahrenheit','Celsius','Rankine'],0],['Which equation is the ideal gas law?',['PV = nRT','P₁V₁ = P₂V₂','V₁/T₁ = V₂/T₂','Ptotal = ΣP'],0],['What does Dalton’s law add together?',['Partial pressures','Volumes','Temperatures','Molar masses'],0],['Which law relates volume and amount of gas at constant temperature and pressure?',['Avogadro’s Law','Boyle’s Law','Gay-Lussac’s Law','Charles’s Law'],0]];let qi=0,score=0;
function quiz(){qi=0;score=0;showQ()}
function showQ(){let x=q[qi];page('Practice Quiz',`<p>Question ${qi+1} of ${q.length} • Score: ${score}</p><h3>${x[0]}</h3>${x[1].map((o,i)=>`<button class="quizopt" data-q="${i}">${o}</button>`).join('')}<div id="r"></div>`)}
function answer(i){let x=q[qi];let r=document.getElementById('r');if(i===x[2]){score++;r.textContent='Correct! 🎉'}else r.textContent='Not quite. Keep going!';setTimeout(()=>{qi++;if(qi<q.length)showQ();else page('Quiz Complete',`<div class="result">You scored ${score}/${q.length}.</div><button class="primary" data-go="quiz">Try Again</button>`);},700)}
document.addEventListener('click',e=>{
if(e.target.closest('[data-notes]')){page('Chemistry Notes',`<div class=\"law\"><h3>Moles</h3><div class=\"formula\">n = m/M</div></div><div class=\"law\"><h3>Molarity</h3><div class=\"formula\">C = n/V</div></div><div class=\"law\"><h3>Dilution</h3><div class=\"formula\">C₁V₁ = C₂V₂</div></div><div class=\"law\"><h3>Ideal Gas Law</h3><div class=\"formula\">PV = nRT</div></div>`);return}if(e.target.closest('[data-progress]')){page('My Progress',`<p>Your quiz progress is stored in this browser for the current ChemCalc version.</p><div class=\"result\">Keep practicing to build your score.</div>`);return}let b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-home'))return home();if(b.dataset.go){let x=b.dataset.go;if(x==='gas')gas();else if(x==='balance')balance();else if(x==='quiz')quiz();else if(x==='periodic')periodic();else if(x==='mass')page('Molar Mass',`<input id="mf" placeholder="H2O"><button class="primary" data-mm>Calculate</button><div id="r"></div>`);else if(x==='moles')page('Moles',`<label>Mass (g)</label><input id="ma" type="number" step="any"><label>Molar mass (g/mol)</label><input id="mm" type="number" step="any"><button class="primary" data-moles>Calculate</button><div id="r"></div>`);return}if(b.dataset.g)form(b.dataset.g);if(b.dataset.gcalc)gascalc(b.dataset.gcalc);if(b.hasAttribute('data-balance'))doBalance();if(b.dataset.q){answer(Number(b.dataset.q))}if(b.dataset.el){let z=Number(b.dataset.el),x=elements.find(e=>e[2]===z);document.getElementById('elementInfo').textContent=`${x[1]} (${x[0]}) • Atomic number ${x[2]}`};if(b.hasAttribute('data-mm')){let f=document.getElementById('mf').value,total=0,mm={'H':1.008,'O':15.999,'C':12.011,'N':14.007,'Na':22.990,'Cl':35.45,'Ca':40.078,'S':32.06};for(let m of f.matchAll(/([A-Z][a-z]?)(\d*)/g))total+=(mm[m[1]]||0)*Number(m[2]||1);document.getElementById('r').textContent=total?`Molar mass = ${total.toFixed(3)} g/mol`:'Use a common formula.'}if(b.hasAttribute('data-moles')){let a=Number(document.getElementById('ma').value),m=Number(document.getElementById('mm').value);document.getElementById('r').textContent=a&&m?`n = ${(a/m).toFixed(4)} mol`:'Enter valid values.'}});
</script>

<script>
(function(){
const KEY='chemcalc4s3';
let st=JSON.parse(localStorage.getItem(KEY)||'{"attempted":0,"correct":0,"saved":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(st))}
function s3page(title,html){panel.innerHTML='<button class="back" data-home>← Home</button><h2>'+title+'</h2>'+html}
function savedPage(){
 let rows=st.saved.length?st.saved.map(x=>'<div class="s3-item"><b>'+x.title+'</b><br>'+x.result+'<br><small>'+x.time+'</small></div>').join(''):'<p class="muted">No saved work yet.</p>';
 s3page('Saved Work','<div class="s3-panel">'+rows+'<button class="s3-btn" id="s3clear">Clear Saved Work</button></div>');
 document.getElementById('s3clear').onclick=()=>{st.saved=[];save();savedPage()}
}
function progressPage(){let acc=st.attempted?Math.round(st.correct/st.attempted*100):0;s3page('My Progress','<div class="s3-panel"><h3>📊 Study Progress</h3><p>Questions attempted: <b>'+st.attempted+'</b></p><p>Correct answers: <b>'+st.correct+'</b></p><p>Accuracy: <b>'+acc+'%</b></p></div>')}
function notesPage(){s3page('Chemistry Notes','<div class="s3-panel"><div class="s3-item"><b>Atomic Structure</b><p>Atoms contain protons, neutrons and electrons.</p></div><div class="s3-item"><b>Moles</b><p>n = m/M and N = nNₐ.</p></div><div class="s3-item"><b>Acids and Bases</b><p>pH = −log[H⁺]. At 25°C, pH + pOH = 14.</p></div><div class="s3-item"><b>Gas Laws</b><p>Boyle: P₁V₁=P₂V₂. Charles: V₁/T₁=V₂/T₂. Ideal: PV=nRT.</p></div><div class="s3-item"><b>Stoichiometry</b><p>Use a balanced equation to compare mole ratios between substances.</p></div></div>')}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-s3]');
 if(b){e.preventDefault();let x=b.dataset.s3;if(x==='saved')savedPage();if(x==='progress')progressPage();if(x==='notes')notesPage()}
 if(e.target.id==='s3dark'){document.body.classList.toggle('s3-dark');localStorage.setItem('chemDark',document.body.classList.contains('s3-dark'))}
});
const qbox=document.getElementById('s3search');

</style><script>
(function(){
  const root=document.body;
  const oldHome=window.home;
  const atomic={H:1.008,C:12.011,N:14.007,O:15.999,Na:22.990,Cl:35.45,Ca:40.078,S:32.06,Mg:24.305,K:39.098,Fe:55.845,Al:26.982,P:30.974,Cu:63.546,Zn:65.38,Ag:107.868,I:126.904,Br:79.904};
  function s5page(title,html){panel.innerHTML='<button class="back" data-home>← Home</button><h2>'+title+'</h2>'+html;panel.scrollIntoView({behavior:'smooth',block:'start'});}
  function val(id){const e=document.getElementById(id);return e?Number(e.value):NaN}
  function saveCalc(title,result){try{const st=JSON.parse(localStorage.getItem('chemcalc4s3')||'{"attempted":0,"correct":0,"saved":[]}');st.saved=st.saved||[];st.saved.unshift({title,result,time:new Date().toLocaleString()});st.saved=st.saved.slice(0,30);localStorage.setItem('chemcalc4s3',JSON.stringify(st));return true}catch(e){return false}}
  function formulaMass(f){let total=0;const re=/([A-Z][a-z]?)(\d*)/g;let m;while((m=re.exec(f))){if(!(m[1] in atomic))return NaN;total+=atomic[m[1]]*Number(m[2]||1)}return total}
  function calcPage(type){
    const common=(fields,button='Calculate')=>fields.map(x=>'<label>'+x[1]+'</label><input id="'+x[0]+'" type="number" step="any" placeholder="'+(x[2]||'')+'">').join('')+'<button class="primary" data-s5calc="'+type+'">'+button+'</button><div id="s5r" class="s5-result" aria-live="polite">Your answer and working will appear here.</div>';
    let body='';
    if(type==='percent')body='<div class="s5-card"><label>Formula</label><input id="s5formula" placeholder="H2O"><button class="primary" data-s5calc="percent">Calculate % composition</button><div id="s5r" class="s5-result">Enter a formula.</div></div>';
    if(type==='empirical')body='<div class="s5-card"><p class="s5-note">Enter the mass or percentage of each element. Zero means the element is absent.</p><div class="s5-grid">'+['C','H','O','N'].map(e=>'<div><label>'+e+'</label><input id="emp'+e+'" type="number" step="any" placeholder="0"></div>').join('')+'</div><button class="primary" data-s5calc="empirical">Find Empirical Formula</button><div id="s5r" class="s5-result">Enter values.</div></div>';
    if(type==='concentration')body='<div class="s5-card">'+common([['cM','Moles of solute (mol)'],['cV','Solution volume (L)']])+'</div>';
    if(type==='dilution')body='<div class="s5-card">'+common([['dC1','Initial concentration (M)'],['dV1','Initial volume (L)'],['dC2','Final concentration (M)']])+'</div>';
    if(type==='ph')body='<div class="s5-card">'+common([['h','[H⁺] concentration (mol/L)']])+'</div>';
    if(type==='poh')body='<div class="s5-card">'+common([['oh','[OH⁻] concentration (mol/L)']])+'</div>';
    if(type==='stoich')body='<div class="s5-card"><p class="s5-note">Simple mole-ratio helper. Enter known moles and coefficients from a balanced equation.</p>'+common([['sm','Known moles'],['sc1','Known coefficient'],['sc2','Unknown coefficient']],'Calculate unknown moles')+'</div>';
    s5page({percent:'Percentage Composition',empirical:'Empirical Formula',concentration:'Molar Concentration',dilution:'Dilution',ph:'pH',poh:'pOH',stoich:'Stoichiometry Helper'}[type],body);
  }
  function calc(type){
    const r=document.getElementById('s5r'); if(!r)return;
    let text='';
    try{
      if(type==='percent'){const f=document.getElementById('s5formula').value.trim();const mass=formulaMass(f);if(!f||!Number.isFinite(mass))throw 0;const parts=[];const re=/([A-Z][a-z]?)(\d*)/g;let m;while((m=re.exec(f))){const el=m[1],count=Number(m[2]||1);parts.push(el+': '+(atomic[el]*count/mass*100).toFixed(2)+'%')}text='Molar mass = '+mass.toFixed(3)+' g/mol\n\n'+parts.join('\n')+'\n\nWorking:\n% element = (mass of element in 1 mol ÷ molar mass) × 100';}
      if(type==='empirical'){const els=['C','H','O','N'], vals=els.map(e=>Number(document.getElementById('emp'+e).value)||0), active=[];els.forEach((e,i)=>{if(vals[i]>0)active.push([e,vals[i]/atomic[e]])});if(!active.length)throw 0;const min=Math.min(...active.map(x=>x[1]));let ratios=active.map(x=>[x[0],x[1]/min]);let mult=1;for(let k=1;k<=6;k++){if(ratios.every(x=>Math.abs(x[1]*k-Math.round(x[1]*k))<0.05)){mult=k;break}}const out=ratios.map(x=>x[0]+(Math.round(x[1]*mult)===1?'':Math.round(x[1]*mult))).join('');text='Empirical formula ≈ '+out+'\n\nWorking:\n1. Convert each mass to moles.\n2. Divide all mole values by the smallest.\n3. Multiply to clear simple fractions.\nRatios: '+ratios.map(x=>x[0]+' '+x[1].toFixed(3)).join(', ');}
      if(type==='concentration'){const m=val('cM'),v=val('cV');if(!(m>=0&&v>0))throw 0;const ans=m/v;text='M = '+ans.toFixed(4)+' mol/L\n\nWorking:\nM = moles ÷ volume\nM = '+m+' ÷ '+v;}
      if(type==='dilution'){const c1=val('dC1'),v1=val('dV1'),c2=val('dC2');if(!(c1>0&&v1>0&&c2>0))throw 0;const ans=c1*v1/c2;text='V₂ = '+ans.toFixed(4)+' L\n\nWorking:\nC₁V₁ = C₂V₂\nV₂ = C₁V₁ ÷ C₂\n= '+c1+' × '+v1+' ÷ '+c2;}
      if(type==='ph'){const h=val('h');if(!(h>0))throw 0;const ans=-Math.log10(h);text='pH = '+ans.toFixed(4)+'\n\nWorking:\npH = −log₁₀[H⁺]\n= −log₁₀('+h+')';}
      if(type==='poh'){const oh=val('oh');if(!(oh>0))throw 0;const ans=-Math.log10(oh);text='pOH = '+ans.toFixed(4)+'\n\nWorking:\npOH = −log₁₀[OH⁻]\n= −log₁₀('+oh+')\n\nAt 25°C: pH = 14 − pOH';}
      if(type==='stoich'){const m=val('sm'),c1=val('sc1'),c2=val('sc2');if(!(m>=0&&c1>0&&c2>0))throw 0;const ans=m*c2/c1;text='Unknown moles = '+ans.toFixed(4)+' mol\n\nWorking:\nknown moles × (unknown coefficient ÷ known coefficient)\n= '+m+' × ('+c2+' ÷ '+c1+')';}
      r.textContent=text;saveCalc(type,text);
    }catch(e){r.textContent='Please enter valid positive values.'}
  }
  function more(){s5page('🧮 More Calculators','<p class="s5-note">Choose a calculator. Every result includes the working and is saved to Saved Work.</p><div class="s5-actions"><button data-s5tool="percent">% Composition</button><button data-s5tool="empirical">Empirical Formula</button><button data-s5tool="concentration">Concentration</button><button data-s5tool="dilution">Dilution</button><button data-s5tool="ph">pH</button><button data-s5tool="poh">pOH</button><button data-s5tool="stoich">Stoichiometry</button></div>');}
  function showWorking(){s5page('💡 Show Working','<div class="s5-card"><h3>How ChemCalc solves common problems</h3><p class="s5-step"><b>Moles:</b> n = mass ÷ molar mass.</p><p class="s5-step"><b>Molarity:</b> M = moles ÷ volume in litres.</p><p class="s5-step"><b>Dilution:</b> C₁V₁ = C₂V₂.</p><p class="s5-step"><b>pH:</b> pH = −log₁₀[H⁺].</p><p class="s5-step"><b>Gas laws:</b> choose the law that matches the quantities given, then rearrange for the unknown.</p><p class="s5-step"><b>Stoichiometry:</b> use the coefficients in the balanced equation as mole ratios.</p></div>');}
  // Add Step 5 controls without replacing the working Step 4 UI.
  const nav=document.querySelector('.topnav'); if(nav){const b=document.createElement('button');b.dataset.s5='more';b.textContent='🧮 More Calculators';nav.appendChild(b);const w=document.createElement('button');w.dataset.s5='working';w.textContent='💡 Show Working';nav.appendChild(w)}
  const homeSection=document.getElementById('home'); if(homeSection){const row=document.createElement('div');row.className='grid';row.style.marginTop='10px';row.innerHTML='<button data-s5="more">🧮 More Calculators</button><button data-s5="working">💡 Show Working</button>';homeSection.appendChild(row)}
  document.addEventListener('click',function(e){
    const t=e.target.closest('[data-s5]');if(t){if(t.dataset.s5==='more')more();if(t.dataset.s5==='working')showWorking();return}
    const tool=e.target.closest('[data-s5tool]');if(tool){calcPage(tool.dataset.s5tool);return}
    const c=e.target.closest('[data-s5calc]');if(c){calc(c.dataset.s5calc);return}
  });
})();
</script></body></html>
