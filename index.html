}

function parseChemFormula(s){
  s=s.replace(/\s+/g,'');
  let i=0;
  function readNum(){
    let st=i;
    while(i<s.length && /\d/.test(s[i])) i++;
    return st===i?1:parseInt(s.slice(st,i),10);
  }
  function group(stop){
    const out={};
    while(i<s.length && s[i]!==stop){
      if(s[i]==='('){
        i++;
        const inside=group(')');
        if(s[i]!==')') throw new Error('Unmatched parenthesis');
        i++;
        const mult=readNum();
        for(const e in inside) out[e]=(out[e]||0)+inside[e]*mult;
      }else{
        const m=s.slice(i).match(/^([A-Z][a-z]?)/);
        if(!m) throw new Error('Invalid formula near '+s.slice(i));
        const el=m[1]; i+=el.length;
        const mult=readNum();
        out[el]=(out[el]||0)+mult;
      }
    }
    return out;
  }
  const result=group('');
  if(i!==s.length) throw new Error('Invalid formula');
  return result;
}
function solveBalance(equation){
  let parts=equation.replace(/→|⟶|=/g,'->').split('->');
  if(parts.length!==2) throw new Error('Use → or -> between reactants and products.');
  const sides=parts.map(x=>x.split('+').map(t=>t.trim()).filter(Boolean));
  if(!sides[0].length||!sides[1].length) throw new Error('Both sides need compounds.');
  const terms=[...sides[0],...sides[1]];
  const clean=terms.map(t=>t.replace(/^\d+(?:\.\d+)?\s*/,''));
  const counts=clean.map(parseChemFormula);
  const elements=[...new Set(counts.flatMap(x=>Object.keys(x)))];
  const A=elements.map(el=>counts.map((c,j)=>(j<sides[0].length?1:-1)*(c[el]||0)));
  const m=A.length,n=terms.length;
  // Gaussian elimination on a numeric matrix; stoichiometric matrices are small.
  const M=A.map(r=>r.map(Number));
  let row=0; const piv=[];
  for(let col=0;col<n && row<m;col++){
    let best=row;
    for(let r=row+1;r<m;r++) if(Math.abs(M[r][col])>Math.abs(M[best][col])) best=r;
    if(Math.abs(M[best][col])<1e-10) continue;
    [M[row],M[best]]=[M[best],M[row]];
    const div=M[row][col]; for(let c=col;c<n;c++) M[row][c]/=div;
    for(let r=0;r<m;r++) if(r!==row){
      const f=M[r][col];
      if(Math.abs(f)>1e-10) for(let c=col;c<n;c++) M[r][c]-=f*M[row][c];
    }
    piv.push(col); row++;
  }
  const free=[];
  for(let c=0;c<n;c++) if(!piv.includes(c)) free.push(c);
  if(!free.length) throw new Error('No non-zero balancing solution found.');
  const x=new Array(n).fill(0);
  x[free[free.length-1]]=1;
  for(let r=piv.length-1;r>=0;r--){
    const pc=piv[r];
    let sum=0;
    for(let c=pc+1;c<n;c++) sum+=M[r][c]*x[c];
    x[pc]=-sum;
  }
  if(x.some(v=>Math.abs(v)<1e-9)) throw new Error('Could not determine a unique balance.');
  const denoms=x.map(v=>{
    let bestD=1,bestErr=Math.abs(v);
    for(let d=1;d<=1000;d++){
      const err=Math.abs(v-Math.round(v*d)/d);
      if(err<bestErr){bestErr=err;bestD=d;if(err<1e-10)break;}
    }
    return bestD;
  });
  const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);
  const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
  let L=1; for(const d of denoms)L=lcm(L,d);
  let ints=x.map(v=>Math.round(v*L));
  let g=0; for(const z of ints)g=gcd(g,z);
  ints=ints.map(z=>z/g);
  if(ints.some(z=>z<0)) ints=ints.map(z=>-z);
  if(ints.some(z=>z<=0)) throw new Error('Could not find positive coefficients.');
  const left=ints.slice(0,sides[0].length).map((c,j)=>c+clean[j]).join(' + ');
  const right=ints.slice(sides[0].length).map((c,j)=>c+clean[j+sides[0].length]).join(' + ');
  return {equation:left+' → '+right, coefficients:ints};
}
function balanceUI(){
  panel.innerHTML='<h2>⚖️ Equation Balancer</h2><p class="muted">Enter an unbalanced equation, for example H2 + O2 → H2O.</p><input id="balEq" value="H2 + O2 → H2O" placeholder="Reactants + Reactants → Products"><button class="primary" id="balGo">Balance Equation</button><div id="balResult" class="result"></div>';
  document.getElementById('balGo').addEventListener('click',()=>{
    const out=document.getElementById('balResult');
    try{
      const r=solveBalance(document.getElementById('balEq').value);

    }catch(e){out.textContent='⚠️ '+e.message;}
  });
}

function gasLawsUI(){
  panel.innerHTML=`<h2>💨 Gas Laws</h2><p class="muted">Choose a gas-law calculator. Temperatures are in kelvin.</p>
  <select id="gasLawType"><option value="ideal">Ideal Gas Law (PV=nRT)</option><option value="boyle">Boyle's Law (P₁V₁=P₂V₂)</option><option value="charles">Charles' Law (V₁/T₁=V₂/T₂)</option><option value="combined">Combined Gas Law (P₁V₁/T₁=P₂V₂/T₂)</option></select><div id="gasFields"></div><div id="gasResult"></div>`;
  const type=document.getElementById('gasLawType');
  const fields=document.getElementById('gasFields');
  const render=()=>{
    const t=type.value;
    if(t==='ideal') fields.innerHTML=inp('gn','Moles n')+inp('gT','Temperature T (K)')+inp('gV','Volume V (L)');
    if(t==='boyle') fields.innerHTML=inp('gP1','P₁')+inp('gV1','V₁')+inp('gP2','P₂');
    if(t==='charles') fields.innerHTML=inp('gV1','V₁')+inp('gT1','T₁ (K)')+inp('gT2','T₂ (K)');
    if(t==='combined') fields.innerHTML=inp('gP1','P₁')+inp('gV1','V₁')+inp('gT1','T₁ (K)')+inp('gP2','P₂')+inp('gT2','T₂ (K)');
    fields.insertAdjacentHTML('beforeend','<button class="primary" id="gasGo">Calculate</button>');
    document.getElementById('gasGo').onclick=()=>{
      try{
        let out='';
        if(t==='ideal'){const n=v('gn'),T=v('gT'),V=v('gV'); if(!(n>0&&T>0&&V>0)) throw Error('Enter positive values for n, T and V.'); const R=0.082057; const P=n*R*T/V; out=`PV=nRT\nP = nRT/V\nP = ${n} × ${R} × ${T} / ${V}\nP = <b>${P.toFixed(4)} atm</b>`;}
        if(t==='boyle'){const P1=v('gP1'),V1=v('gV1'),P2=v('gP2'); if(!(P1>0&&V1>0&&P2>0)) throw Error('Enter positive pressures and volume.'); const V2=P1*V1/P2; out=`P₁V₁=P₂V₂\nV₂ = P₁V₁/P₂\nV₂ = <b>${V2.toFixed(4)}</b>`;}
        if(t==='charles'){const V1=v('gV1'),T1=v('gT1'),T2=v('gT2'); if(!(V1>0&&T1>0&&T2>0)) throw Error('Enter positive volume and absolute temperatures.'); const V2=V1*T2/T1; out=`V₁/T₁=V₂/T₂\nV₂ = V₁T₂/T₁\nV₂ = <b>${V2.toFixed(4)} L</b>`;}
        if(t==='combined'){const P1=v('gP1'),V1=v('gV1'),T1=v('gT1'),P2=v('gP2'),T2=v('gT2'); if(!(P1>0&&V1>0&&T1>0&&P2>0&&T2>0)) throw Error('Enter positive pressures, volume and absolute temperatures.'); const V2=P1*V1*T2/(T1*P2); out=`P₁V₁/T₁=P₂V₂/T₂\nV₂ = P₁V₁T₂/(T₁P₂)\nV₂ = <b>${V2.toFixed(4)} L</b>`;}
        document.getElementById('gasResult').innerHTML='<div class="result">'+out+'</div>';
        localStorage.setItem('lastCalc','Gas Laws\n'+out.replace(/<[^>]+>/g,''));
      }catch(e){document.getElementById('gasResult').innerHTML='<div class="result">⚠️ '+e.message+'</div>';}
    };
  };
  type.onchange=render; render();
}

function periodicUI(){
  panel.innerHTML=`<h2>🧬 Periodic Table</h2><p class="muted">Explore all 118 elements. Tap an element for details.</p><input id="elementSearch" placeholder="Search by name, symbol or atomic number"><div id="elements" class="periodicGrid"></div><div id="elementInfo"></div>`;
  const q=document.getElementById('elementSearch');
  const render=()=>{
    const term=q.value.trim().toLowerCase();
    const items=E.filter(x=>!term || x[0].toLowerCase().includes(term) || x[1].toLowerCase().includes(term) || String(x[2])===term);
    const grid=document.getElementById('elements');
    grid.innerHTML='';
    items.forEach(x=>{const b=document.createElement('button');b.className='elementCard';b.innerHTML=`<b>${x[0]}</b><span>${x[2]}</span><small>${x[1]}</small>`;b.onclick=()=>{document.getElementById('elementInfo').innerHTML=`<div class="result"><b>${x[1]} (${x[0]})</b><br>Atomic number: ${x[2]}<br>Relative atomic mass: ${x[3]}<br>Family: ${x[4]}</div>`};grid.appendChild(b);});
    if(!items.length) grid.innerHTML='<p class="muted">No element found.</p>';
  };
  q.oninput=render; render();
}

    ['Ideal Gas Law','PV = nRT. Use kelvin for temperature and keep units consistent.'],
    ['Stoichiometry','Balance the equation first, then use mole ratios from the coefficients.'],
    ['Equilibrium','For Kc or Kp, products are divided by reactants and each concentration or pressure is raised to its coefficient.'],
    ['Buffers','Henderson–Hasselbalch: pH = pKa + log([A⁻]/[HA]).'],

}


function assistantUI(){
  panel.innerHTML='<h2>🤖 Chemistry Assistant</h2><p class="muted">Ask a basic chemistry question. Try: “What is molarity?”, “formula for pH”, or “what is Avogadro number?”</p><textarea id="assistantQ" rows="4" placeholder="Type your chemistry question..."></textarea><button class="primary" id="assistantGo">Ask</button><div id="assistantResult" class="result"></div>';
  const answer=(q)=>{
    q=q.toLowerCase();
    if(q.includes('molarity')) return '<b>Molarity</b> is moles of solute per litre of solution.<br>Formula: M = n/V.';
    if(q.includes('molality')) return '<b>Molality</b> is moles of solute per kilogram of solvent.<br>Formula: m = n/kg solvent.';
    if(q.includes('ph')) return '<b>pH</b> measures acidity. For a solution with [H⁺], pH = −log₁₀[H⁺].';
    if(q.includes('poh')) return '<b>pOH</b> is related to hydroxide concentration: pOH = −log₁₀[OH⁻]. At 25°C, pH + pOH = 14.';
    if(q.includes('avogadro')) return '<b>Avogadro’s constant</b> is 6.02214076 × 10²³ particles per mole.';
    if(q.includes('gas law') || q.includes('pv=nrt')) return '<b>Ideal Gas Law:</b> PV = nRT. Temperature must be in kelvin.';
    if(q.includes('molar mass')) return '<b>Molar mass</b> is the mass of one mole of a substance, usually in g/mol.';
    if(q.includes('stoichiometry')) return '<b>Stoichiometry</b> uses balanced-equation coefficients to relate amounts of reactants and products.';
    if(q.includes('acid') || q.includes('base')) return '<b>Acids and bases:</b> acids increase H⁺ concentration, while bases increase OH⁻ concentration in aqueous solution.';
    return 'Try asking about molarity, molality, pH, pOH, gas laws, molar mass, stoichiometry, acids/bases, or Avogadro’s number.';
  };
  document.getElementById('assistantGo').onclick=()=>{const q=document.getElementById('assistantQ').value.trim();document.getElementById('assistantResult').innerHTML=q?answer(q):'⚠️ Type a chemistry question first.';};
}

function reactionLabUI(){
  panel.innerHTML='<h2>🧪 Reaction Lab</h2><p class="muted">Enter a reaction and balance it, then view a quick reaction check.</p><input id="rxn" value="H2 + O2 → H2O" placeholder="H2 + O2 → H2O"><button class="primary" id="rxnGo">Balance & Analyze</button><div id="rxnResult" class="result"></div>';
  document.getElementById('rxnGo').onclick=()=>{
    const out=document.getElementById('rxnResult');
    try{const raw=document.getElementById('rxn').value.trim();const r=solveBalance(raw);out.innerHTML='<b>Balanced reaction:</b> '+r.equation+'<br><br><b>Coefficients:</b> '+r.coefficients.join(' : ')+'<br><br>Atoms are conserved when the equation is balanced.';localStorage.setItem('lastCalc','Reaction Lab\n'+r.equation);}catch(e){out.textContent='⚠️ '+e.message;}

function dataLabUI(){
  panel.innerHTML='<h2>📈 Data Lab</h2><p class="muted">Enter numerical chemistry data separated by commas, spaces, or new lines.</p><textarea id="dataInput" rows="5" placeholder="12, 18, 21, 15"></textarea><button class="primary" id="dataGo">Analyze Data</button><div id="dataResult" class="result"></div>';
  document.getElementById('dataGo').onclick=()=>{
    const raw=document.getElementById('dataInput').value;const nums=raw.split(/[\s,;]+/).map(Number).filter(Number.isFinite);const out=document.getElementById('dataResult');
    if(!nums.length){out.textContent='⚠️ Enter at least one number.';return;}
    const sum=nums.reduce((a,b)=>a+b,0),mean=sum/nums.length,min=Math.min(...nums),max=Math.max(...nums);
    const variance=nums.reduce((a,b)=>a+(b-mean)**2,0)/nums.length;
    out.innerHTML=`<b>n:</b> ${nums.length}<br><b>Mean:</b> ${mean.toFixed(4)}<br><b>Minimum:</b> ${min}<br><b>Maximum:</b> ${max}<br><b>Range:</b> ${(max-min).toFixed(4)}<br><b>Population SD:</b> ${Math.sqrt(variance).toFixed(4)}`;
    localStorage.setItem('lastCalc','Data Lab\nMean = '+mean.toFixed(4));
  };
}

 searchForm();if(i===17)return assistantUI();if(i===18)return reactionLabUI();if(i===19)return dataLabUI();if(i===20)return new70List()}

function new70Calc(x){
  const f={
    'Rate Law':[inp('a','Rate constant k')+inp('b','Concentration [A]')+inp('c','Reaction order n'),
      ()=>`Rate = k[A]ⁿ = <b>${(v('a')*Math.pow(v('b'),v('c'))).toExponential(6)}</b> (concentration/time)`],
    'Arrhenius Equation':[inp('a','Activation energy Ea (J/mol)')+inp('b','Temperature T (K)')+inp('c','Pre-exponential factor A'),
      ()=>`k = A·e⁻ᴱᵃ⁄ᴿᵀ = <b>${(v('c')*Math.exp(-v('a')/(8.314*v('b')))).toExponential(6)}</b>`],
    'Gibbs Free Energy':[inp('a','Enthalpy ΔH (kJ/mol)')+inp('b','Temperature T (K)')+inp('c','Entropy ΔS (J/mol·K)'),
      ()=>`ΔG = ΔH − TΔS = <b>${(v('a')-v('b')*v('c')/1000).toFixed(4)} kJ/mol</b>`],
    'Osmotic Pressure':[inp('a','Molar concentration (mol/L)')+inp('b','Temperature (K)')+inp('c','Van’t Hoff factor i'),
      ()=>`π = iMRT = <b>${(v('c')*v('a')*0.082057*v('b')).toFixed(4)} atm</b>`],
    'Freezing Point Depression':[inp('a','Kf (°C·kg/mol)')+inp('b','Molality (mol/kg)')+inp('c','Van’t Hoff factor i'),
      ()=>`ΔTf = iKf m = <b>${(v('c')*v('a')*v('b')).toFixed(4)} °C</b>`],
    'Boiling Point Elevation':[inp('a','Kb (°C·kg/mol)')+inp('b','Molality (mol/kg)')+inp('c','Van’t Hoff factor i'),
      ()=>`ΔTb = iKb m = <b>${(v('c')*v('a')*v('b')).toFixed(4)} °C</b>`],
    'pH from [H⁺]':[inp('a','[H⁺] (mol/L)'),()=>`pH = −log[H⁺] = <b>${(-Math.log10(v('a'))).toFixed(4)}</b>`],
    'pOH from [OH⁻]':[inp('a','[OH⁻] (mol/L)'),()=>`pOH = −log[OH⁻] = <b>${(-Math.log10(v('a'))).toFixed(4)}</b>`],
    'Cell Potential':[inp('a','E° cathode (V)')+inp('b','E° anode (V)'),()=>`E°cell = E°cathode − E°anode = <b>${(v('a')-v('b')).toFixed(4)} V</b>`],
    'Faraday Electrolysis':[inp('a','Current I (A)')+inp('b','Time t (s)')+inp('c','Molar mass M (g/mol)')+inp('d','Electrons n'),
      ()=>`Mass = ItM/(nF) = <b>${(v('a')*v('b')*v('c')/(v('d')*96485)).toFixed(6)} g</b>`]
  }[x];
  calc(x,f[0],f[1]);
}
