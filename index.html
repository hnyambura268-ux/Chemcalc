function parseFormula(s){let out={};let re=/([A-Z][a-z]?)(\d*)/g,m;while((m=re.exec(s))){let el=m[1],c=Number(m[2]||1);out[el]=(out[el]||0)+c}return out}
function gcd(a,b){while(b){let t=a%b;a=b;b=t}return Math.abs(a)}
function lcm(a,b){return Math.abs(a*b)/gcd(a,b)}
function balanceEq(eq){
  eq=eq.replace(/→|=/g,'->');
  const parts=eq.split('->'); if(parts.length!==2)return null;
  const L=parts[0].split('+').map(x=>x.trim()).filter(Boolean), R=parts[1].split('+').map(x=>x.trim()).filter(Boolean);
  const species=L.concat(R); if(!L.length||!R.length||species.length>4)return null;
  const parsed=species.map(parseFormula);
  const els=[...new Set(parsed.flatMap(o=>Object.keys(o)))];
  const max=30;
  function ok(c){for(const el of els){let a=0,b=0;L.forEach((_,i)=>a+=(parsed[i][el]||0)*c[i]);R.forEach((_,j)=>b+=(parsed[L.length+j][el]||0)*c[L.length+j]);if(a!==b)return false;}return true;}
  function gcdList(a){return a.reduce((g,v)=>gcd(g,Math.abs(v)),0)||1}
  function norm(c){let g=gcdList(c);c=c.map(v=>v/g);if(c.some(v=>v<0))c=c.map(v=>-v);return c;}
  for(let c1=1;c1<=max;c1++)for(let c2=1;c2<=max;c2++)for(let c3=1;c3<=max;c3++)for(let c4=1;c4<=max;c4++){
    const c=species.length===2?[c1,c2]:species.length===3?[c1,c2,c3]:[c1,c2,c3,c4];
    if(ok(c)){const n=norm(c);if(n.every(v=>v>0))return n;}
  }
  return null;
}

      heat:['🔥 Calorimetry',input('hm','Mass (g)','100')+input('hc','Specific heat (J/g°C)','4.18')+input('hd','ΔT (°C)','5'),'q = mcΔT'],
      half:['⏳ Half-Life',input('hN','Initial amount','100')+input('ht','Time','10')+input('hh','Half-life','5'),'N = N₀(1/2)^(t/t½)'],
      sigfig:['🔢 Significant Figures','<label>Number</label><input id="sg" type="text" inputmode="decimal" placeholder="0.0045600">','Count meaningful digits'],
      scientific:['🔬 Scientific Notation','<label>Number</label><input id="sn" type="text" inputmode="decimal" placeholder="0.000456">','a × 10ⁿ'],
      kc:['⚖️ Equilibrium Kc',input('kp1','Product 1 concentration','1')+input('kp2','Product 2 concentration','1')+input('kr1','Reactant 1 concentration','1')+input('kr2','Reactant 2 concentration','1'),'Kc = [products] / [reactants]'],
      ka:['🧪 Ka',input('kh','[H⁺]','0.001')+input('kaA','[A⁻]','0.001')+input('kha','[HA]','0.1'),'Ka = [H⁺][A⁻] / [HA]'],
      ksp:['💧 Ksp',input('kx','[cation]','0.001')+input('ky','[anion]','0.001'),'Ksp = product of ion concentrations raised to stoichiometric powers'],
      beer:['🌈 Beer–Lambert',input('be','ε','100')+input('bb','Path length b (cm)','1')+input('bc','Concentration c (M)','0.01'),'A = εbc']
    };
    const x=pages[t]; if(!x)return; fields(x[0],x[1],x[2]);
  }
  function num(id){const e=document.getElementById(id); return e?Number(e.value):NaN}
  function calc(t){
    let ans,work;
    try{
      if(t==='molarity'){ans=num('em')/num('ev');work='M = 0.50 ÷ 2.00 = '+ans.toFixed(4)+' M';}
      else if(t==='molality'){ans=num('em')/num('ek');work='m = '+num('em')+' ÷ '+num('ek')+' = '+ans.toFixed(4)+' mol/kg';}
      else if(t==='normality'){ans=num('ee')/num('ev');work='N = '+num('ee')+' ÷ '+num('ev')+' = '+ans.toFixed(4)+' N';}
      else if(t==='fraction'){ans=num('ex')/num('et');work='X = '+num('ex')+' ÷ '+num('et')+' = '+ans.toFixed(4);}
      else if(t==='ppm'){ans=num('es')/num('esol')*1e6;work='ppm = ('+num('es')+' ÷ '+num('esol')+') × 10⁶ = '+ans.toFixed(4);}
      else if(t==='ppb'){ans=num('bs')/num('bsol')*1e9;work='ppb = ('+num('bs')+' ÷ '+num('bsol')+') × 10⁹ = '+ans.toFixed(4);}
      else if(t==='density'){ans=num('dm')/num('dv');work='d = '+num('dm')+' ÷ '+num('dv')+' = '+ans.toFixed(4)+' g/mL';}
      else if(t==='avogadro'){ans=num('an')*6.02214076e23;work='particles = '+num('an')+' × 6.022×10²³ = '+ans.toExponential(6);}
      else if(t==='yield'){ans=num('ya')/num('yt')*100;work='% yield = ('+num('ya')+' ÷ '+num('yt')+') × 100 = '+ans.toFixed(2)+'%';}
      else if(t==='limit'){const a=num('la')/num('ca'),b=num('lb')/num('cb');ans=a<b?'A is limiting':'B is limiting';work='A ratio = '+a.toFixed(4)+'; B ratio = '+b.toFixed(4)+' → '+ans+'.';}
      else if(t==='theory'){ans=num('lm')*num('lp')/num('lr')*num('pm');work='moles product = '+num('lm')+' × ('+num('lp')+' ÷ '+num('lr')+')\nMass = moles × '+num('pm')+' = '+ans.toFixed(4)+' g';}
      else if(t==='excess'){const a=num('ea'),b=num('eb'),ca=num('eca'),cb=num('ecb'),bNeeded=a*cb/ca; const aNeeded=b*ca/cb; if(a/ca<b/cb){ans=b-bNeeded;work='A limits. B consumed = '+bNeeded.toFixed(4)+' mol; B remaining = '+ans.toFixed(4)+' mol.'}else{ans=a-aNeeded;work='B limits. A consumed = '+aNeeded.toFixed(4)+' mol; A remaining = '+ans.toFixed(4)+' mol.'}}
      else if(t==='heat'){ans=num('hm')*num('hc')*num('hd');work='q = mcΔT = '+num('hm')+' × '+num('hc')+' × '+num('hd')+' = '+ans.toFixed(4)+' J';}
      else if(t==='half'){ans=num('hN')*Math.pow(0.5,num('ht')/num('hh'));work='N = N₀(1/2)^(t/t½) = '+ans.toFixed(4);}
      else if(t==='sigfig'){const z=document.getElementById('sg').value.trim(); const m=z.match(/[1-9]/g); ans=m?m.length:0; work='Significant figures counted in '+esc(z)+': '+ans;}
      else if(t==='scientific'){const z=Number(document.getElementById('sn').value); if(!Number.isFinite(z))throw 0; ans=z.toExponential(6);work='Scientific notation: '+ans;}
      else if(t==='kc'){ans=(num('kp1')*num('kp2'))/(num('kr1')*num('kr2'));work='Kc = ('+num('kp1')+'×'+num('kp2')+') ÷ ('+num('kr1')+'×'+num('kr2')+') = '+ans.toFixed(6);}
      else if(t==='ka'){ans=(num('kh')*num('kaA'))/num('kha');work='Ka = ('+num('kh')+'×'+num('kaA')+') ÷ '+num('kha')+' = '+ans.toExponential(6);}
      else if(t==='ksp'){ans=num('kx')*num('ky');work='For a simple 1:1 salt, Ksp = [cation][anion] = '+ans.toExponential(6);}
      else if(t==='beer'){ans=num('be')*num('bb')*num('bc');work='A = εbc = '+num('be')+' × '+num('bb')+' × '+num('bc')+' = '+ans.toFixed(6);}
      else throw 0;
      const r=document.getElementById('enhR'); if(!r) return; if(!Number.isFinite(ans)){throw 0;} r.textContent='Answer: '+ans+'\n\nShow Working:\n'+work;
    }catch(e){const r=document.getElementById('enhR');if(r)r.textContent='Please enter valid values.'}
  }
  document.addEventListener('click',e=>{
    const more=e.target.closest('[data-enhanced="more"]'); if(more){enhancedPage();return;}
    const t=e.target.closest('[data-enhanced-tool]'); if(t){tool(t.dataset.enhancedTool);return;}
    if(e.target.closest('[data-enhanced-calc]')){const title=document.querySelector('#panel h2')?.textContent||'';const map={'🧪 Molarity':'molarity','🧪 Molality':'molality','⚗️ Normality':'normality','🔢 Mole Fraction':'fraction','💧 ppm':'ppm','💧 ppb':'ppb','⚖️ Density':'density','🔬 Avogadro':'avogadro','📈 Percent Yield':'yield','⚗️ Limiting Reactant':'limit','📊 Theoretical Yield':'theory','⚖️ Excess Reactant':'excess','🔥 Calorimetry':'heat','⏳ Half-Life':'half','🔢 Significant Figures':'sigfig','🔬 Scientific Notation':'scientific','⚖️ Equilibrium Kc':'kc','🧪 Ka':'ka','💧 Ksp':'ksp','🌈 Beer–Lambert':'beer'}; const k=map[title]; if(k)calc(k);}
  });
})();
</script>
<script>
(function(){
  function s51page(title,html){panel.innerHTML='<button class="back" data-home>← Home</button><h2>'+title+'</h2>'+html;panel.scrollIntoView({behavior:'smooth',block:'start'});}
  function i(id,label,ph){return '<label>'+label+'</label><input id="s51_'+id+'" type="number" step="any" placeholder="'+(ph||'')+'">'}
  function v(id){let e=document.getElementById('s51_'+id);return e?Number(e.value):NaN}
  const tools={
    stoich:['⚗️ Advanced Stoichiometry','Use a balanced equation to convert a known reactant amount into product amount.',i('sm','Known reactant moles','0.50')+i('rc','Reactant coefficient','2')+i('pc','Product coefficient','3')+i('pm','Product molar mass (g/mol)','44')],
    limiting3:['⚗️ Limiting Reactant — 3 Reactants','Compare mole/coefficient ratios for three reactants.',i('a','Reactant A moles','2')+i('b','Reactant B moles','3')+i('c','Reactant C moles','1')+i('ca','A coefficient','1')+i('cb','B coefficient','2')+i('cc','C coefficient','1')],
    kp:['⚖️ Equilibrium Kp','Calculate Kp from partial pressures.',i('p1','Product 1 pressure','0.5')+i('p2','Product 2 pressure','0.4')+i('r1','Reactant 1 pressure','0.2')+i('r2','Reactant 2 pressure','0.3')],
    kb:['🧪 Kb','Calculate Kb = [OH⁻][BH⁺]/[B].',i('oh','[OH⁻]','0.001')+i('bh','[BH⁺]','0.001')+i('base','[B]','0.1')],
    pka:['🧪 pKa / pKb','Convert Ka or Kb to pKa or pKb.',i('k','Ka or Kb','1e-5')],
    buffer:['🧪 Buffer pH','Henderson–Hasselbalch equation: pH = pKa + log([A⁻]/[HA]).',i('pk','pKa','4.76')+i('salt','[A⁻]','0.10')+i('acid','[HA]','0.20')],
    ksp2:['💧 Ksp — 1:1 Salt','For MX(s) ⇌ M⁺ + X⁻, Ksp = s².',i('sol','Molar solubility s (mol/L)','0.001')],
    nernst:['🔋 Nernst Equation','At 25°C: E = E° − (0.05916/n)logQ.',i('e0','E° (V)','1.10')+i('nn','Electrons n','2')+i('q','Reaction quotient Q','0.01')]
  };
  function menu(){s51page('🚀 ChemCalc 5.6 — Advanced Tools','<p class="s51-note">Advanced stoichiometry plus higher-level equilibrium, acid–base and electrochemistry tools.</p><div class="s51-grid">'+Object.keys(tools).map(k=>'<button class="s4-answer" data-s51tool="'+k+'"><b>'+tools[k][0]+'</b><br><span class="s4-small">'+tools[k][1]+'</span></button>').join('')+'</div>')}
  function tool(k){let d=tools[k]; if(!d)return;s51page(d[0],'<div class="s51-card"><div class="s51-badge">CHEMCALC 5.6</div><p class="s51-note">'+d[1]+'</p>'+d[2]+'<button class="primary" data-s51calc="'+k+'">Calculate</button><div id="s51r" class="s51-result" aria-live="polite">Enter values to calculate.</div></div>')}
  function calc(k){let a,w;try{
    if(k==='stoich'){a=v('sm')*v('pc')/v('rc')*v('pm');w='Moles product = known moles × (product coefficient ÷ reactant coefficient)\n= '+v('sm')+' × ('+v('pc')+' ÷ '+v('rc')+')\n= '+(v('sm')*v('pc')/v('rc')).toFixed(4)+' mol\nMass product = moles × molar mass\n= '+a.toFixed(4)+' g';}
    else if(k==='limiting3'){let rs=[v('a')/v('ca'),v('b')/v('cb'),v('c')/v('cc')];let min=Math.min(...rs),idx=rs.indexOf(min);a=min;w='A ratio = '+rs[0].toFixed(4)+'\nB ratio = '+rs[1].toFixed(4)+'\nC ratio = '+rs[2].toFixed(4)+'\nLimiting reactant = '+['A','B','C'][idx];}
    else if(k==='kp'){a=(v('p1')*v('p2'))/(v('r1')*v('r2'));w='Kp = (P₁×P₂) ÷ (Pᵣ₁×Pᵣ₂)\n= '+a.toExponential(6);}
    else if(k==='kb'){a=(v('oh')*v('bh'))/v('base');w='Kb = [OH⁻][BH⁺]/[B]\n= ('+v('oh')+'×'+v('bh')+') ÷ '+v('base')+'\n= '+a.toExponential(6);}
    else if(k==='pka'){let x=v('k');if(x<=0)throw 0;a=-Math.log10(x);w='pK = −log₁₀(K)\n= '+a.toFixed(4);}
    else if(k==='buffer'){a=v('pk')+Math.log10(v('salt')/v('acid'));w='pH = pKa + log([A⁻]/[HA])\n= '+v('pk')+' + log('+v('salt')+'/'+v('acid')+')\n= '+a.toFixed(4);}
    else if(k==='ksp2'){a=v('sol')**2;w='Ksp = s² = ('+v('sol')+')² = '+a.toExponential(6);}
    else if(k==='nernst'){a=v('e0')-(0.05916/v('nn'))*Math.log10(v('q'));w='E = E° − (0.05916/n)logQ\n= '+a.toFixed(4)+' V';}
    else throw 0;
    if(!Number.isFinite(a))throw 0;document.getElementById('s51r').textContent='Answer: '+a+'\n\nShow Working:\n'+w;
  }catch(e){document.getElementById('s51r').textContent='Please enter valid positive values.'}}
  const nav=document.querySelector('.topnav');if(nav&&!document.querySelector('[data-s51="menu"]')){let b=document.createElement('button');b.dataset.s51='menu';b.textContent='🚀 Advanced 5.6';nav.appendChild(b)}
  const home=document.getElementById('home');if(home){let row=document.createElement('div');row.className='grid';row.style.marginTop='10px';row.innerHTML='<button data-s51="menu">🚀 Advanced 5.6</button>';home.appendChild(row)}
  document.addEventListener('click',e=>{let b=e.target.closest('[data-s51="menu"]');if(b){menu();return}let t=e.target.closest('[data-s51tool]');if(t){tool(t.dataset.s51tool);return}let c=e.target.closest('[data-s51calc]');if(c){calc(c.dataset.s51calc);return}});
})();
</script><script>(function(){const db=[['Water','H₂O',18.015,'Compound','Molar mass 18.015 g/mol'],['Sodium chloride','NaCl',58.44,'Salt','Molar mass 58.44 g/mol'],['Carbon dioxide','CO₂',44.01,'Oxide','Molar mass 44.01 g/mol'],['Sulfuric acid','H₂SO₄',98.079,'Acid','Diprotic strong acid'],['Hydrochloric acid','HCl',36.46,'Acid','Strong acid'],['Sodium hydroxide','NaOH',40.00,'Base','Strong base'],['Calcium carbonate','CaCO₃',100.086,'Salt','Common carbonate'],['Ammonia','NH₃',17.031,'Base','Weak base'],['Glucose','C₆H₁₂O₆',180.156,'Organic','Molar mass 180.156 g/mol'],['Oxygen','O₂',31.998,'Elemental molecule','Diatomic gas'],['Hydrogen','H₂',2.016,'Elemental molecule','Diatomic gas'],['Nitrogen','N₂',28.014,'Elemental molecule','Diatomic gas'],['Methane','CH₄',16.043,'Organic','Simplest alkane'],['Ethanol','C₂H₆O',46.069,'Organic','Common alcohol'],['Potassium permanganate','KMnO₄',158.034,'Salt','Oxidizing agent']];function page(title,html){document.querySelectorAll('main>section').forEach(x=>x.style.display='none');let m=document.querySelector('main');let old=document.getElementById('s55page');if(old)old.remove();let d=document.createElement('section');d.id='s55page';d.className='card';d.innerHTML='<button class="secondary" data-s55home>← Home</button><h2>'+title+'</h2>'+html;m.appendChild(d)}function menu(){page('🔎 ChemCalc 5.6 — Smart Chemistry Search','<p>Search by chemical name, formula, topic, or common term.</p><input id="s55q" class="s55-input" placeholder="e.g. water, H2SO4, acid"><div id="s55out"></div><h3>🧪 Formula Database</h3><div class="s55-grid">'+db.map((x,i)=>'<button class="s4-answer" data-s55item="'+i+'"><b>'+x[0]+'</b><br><span class="s55-muted">'+x[1]+' · '+x[2]+' g/mol</span></button>').join('')+'</div>');render();document.getElementById('s55q').addEventListener('input',render)}function render(){let q=(document.getElementById('s55q')?.value||'').toLowerCase().trim(),out=document.getElementById('s55out');if(!out)return;let rows=db.filter(x=>!q||x.join(' ').toLowerCase().includes(q));out.innerHTML='<p class="s55-muted">'+rows.length+' result'+(rows.length===1?'':'s')+'</p>'+rows.map(x=>'<div class="s55-item"><b>'+x[0]+'</b> <span class="s55-tag">'+x[1]+'</span><div>'+x[2]+' g/mol · '+x[3]+'</div><div class="s55-muted">'+x[4]+'</div></div>').join('')+(rows.length?'':'<div class="s55-item">No match found. Try a chemical name, formula, or topic.</div>')}document.addEventListener('click',e=>{if(e.target.closest('[data-s55home]')){document.getElementById('s55page')?.remove();document.querySelectorAll('main>section').forEach(x=>x.style.display='');}let b=e.target.closest('[data-s55item]');if(b){let x=db[+b.dataset.s55item];alert(x[0]+'\nFormula: '+x[1]+'\nMolar mass: '+x[2]+' g/mol\nType: '+x[3]+'\n'+x[4])}});const nav=document.querySelector('.topnav');if(nav&&!document.querySelector('[data-s55menu]')){let b=document.createElement('button');b.dataset.s55menu='';b.textContent='🔎 Search & Formulas';nav.appendChild(b)}let home=document.getElementById('home');if(home&&!document.querySelector('[data-s55homebtn]')){let row=document.createElement('div');row.className='grid';row.innerHTML='<button data-s55homebtn>🔎 Smart Search & Formula Database</button>';home.appendChild(row)}document.addEventListener('click',e=>{if(e.target.closest('[data-s55menu]')||e.target.closest('[data-s55homebtn]'))menu()})})();</script><script>(function(){document.addEventListener('click',function(e){if(!e.target.closest('[data-s56check]'))return;const checks=[['Version label','ChemCalc 5.6'],['Periodic table','118 elements'],['Calculator library','20+ tools'],['Smart search','Formula database'],['Learning','Practice + Advanced Quiz'],['Study tools','Notes + Formula Builder'],['Tracking','Saved + Progress']];let html='<button class="back" data-home>← Home</button><h2>✅ ChemCalc 5.6 Final Check</h2><p class="muted">Core features included in this build:</p><div class="s4-card">'+checks.map(x=>'<p>✓ <b>'+x[0]+':</b> '+x[1]+'</p>').join('')+'</div><div class="cc56-tools"><button class="primary" data-home>← Back Home</button></div>';page('Final Check',html);if(window.cc56Status)cc56Status('✓ Final check opened');});})();</script></body></html>
